<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemilihan OSIS SMAN 1 Seunuddon</title>
<style>html,body{margin:0;background:#e9eef8}body{padding:12px}</style>
</head>
<body>
<!-- ===== PEMILIHAN OSIS SMAN 1 SEUNUDDON - tempel di Laman Blogger (mode HTML) ===== -->
<div id="osis-app">
<style>
#osis-app{--biru:#0b3d91;--biru2:#1d63d6;--hijau:#13a05b;--abu:#5b6577;--garis:#dfe5f0;--bg:#f4f7fc;
  font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1c2333;background:var(--bg);border-radius:16px;
  padding:16px;max-width:1000px;margin:0 auto;box-sizing:border-box;line-height:1.45}
#osis-app *{box-sizing:border-box}
#osis-app .hd{background:linear-gradient(135deg,var(--biru),var(--biru2));color:#fff;border-radius:14px;padding:14px 18px;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:14px}
#osis-app .hd .jdl{flex:1;min-width:0}
#osis-app .logo{width:68px;height:68px;flex:none;object-fit:contain;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#osis-app .hd h2{margin:0;font-size:1.35rem;color:#fff;border:0;padding:0}
#osis-app .hd p{margin:4px 0 0;opacity:.9;font-size:.92rem}
#osis-app .nav{display:flex;gap:8px;margin:14px 0;justify-content:center}
#osis-app .nav button{flex:1;max-width:220px;padding:10px 14px;border:2px solid var(--biru);background:#fff;color:var(--biru);
  border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem}
#osis-app .nav button.on{background:var(--biru);color:#fff}
#osis-app .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
#osis-app .card{background:#fff;border:3px solid var(--garis);border-radius:16px;padding:14px;text-align:center;cursor:pointer;
  transition:.15s;position:relative;user-select:none}
#osis-app .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(11,61,145,.15)}
#osis-app .card.pilih{border-color:var(--hijau);background:#effaf4;box-shadow:0 0 0 4px rgba(19,160,91,.2)}
#osis-app .duo{display:flex;gap:10px;justify-content:center;margin:12px 0 6px}
#osis-app .org{flex:1;min-width:0;text-align:center}
#osis-app .foto{width:118px;height:118px;max-width:100%;aspect-ratio:1/1;border-radius:50%;margin:0 auto 6px;overflow:hidden;background:#e8eefb;
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;color:var(--biru);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#osis-app .foto img{width:100%;height:100%;object-fit:cover}
#osis-app .peran{display:block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--biru2)}
#osis-app .org h4{margin:2px 0 0;font-size:.98rem;line-height:1.25;color:#1c2333}
#osis-app .no{display:inline-block;background:var(--biru);color:#fff;border-radius:999px;padding:2px 14px;font-weight:700;font-size:.85rem}
#osis-app .kls{color:var(--abu);font-size:.88rem}
#osis-app .visi{margin-top:8px;font-size:.88rem;color:#394258;text-align:left;white-space:pre-line}
#osis-app .cek{position:absolute;top:10px;right:12px;font-size:1.6rem;display:none;color:var(--hijau)}
#osis-app .card.pilih .cek{display:block}
#osis-app .bar-aksi{position:sticky;bottom:8px;margin-top:16px;background:#fff;border:2px solid var(--garis);border-radius:14px;
  padding:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.08)}
#osis-app .info{font-weight:600}
#osis-app .btn{background:var(--hijau);color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:1.05rem;font-weight:800;cursor:pointer}
#osis-app .btn:disabled{background:#b8c2d3;cursor:not-allowed}
#osis-app .btn.merah{background:#d33}
#osis-app .btn.kecil{padding:9px 16px;font-size:.9rem}
#osis-app .pesan{margin:12px 0;padding:12px 14px;border-radius:10px;font-weight:600;text-align:center}
#osis-app .pesan.err{background:#fdecec;color:#b42318}
#osis-app .pesan.tutup{background:#fff4e0;color:#8a5200;font-size:1.1rem;padding:30px}
#osis-app .tengah{text-align:center;padding:50px 10px}
#osis-app .terima{font-size:4rem;color:var(--hijau)}
#osis-app .terima-j{font-size:1.5rem;font-weight:800;margin:6px 0}
#osis-app .box{background:#fff;border:2px solid var(--garis);border-radius:14px;padding:18px;max-width:420px;margin:30px auto;text-align:center}
#osis-app .box input{width:100%;padding:12px;font-size:1.2rem;text-align:center;border:2px solid var(--garis);border-radius:10px;margin:10px 0;letter-spacing:4px}
#osis-app .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
#osis-app .tile{background:#fff;border:2px solid var(--garis);border-radius:12px;padding:12px;text-align:center}
#osis-app .tile b{display:block;font-size:1.7rem;color:var(--biru)}
#osis-app .tile span{font-size:.82rem;color:var(--abu)}
#osis-app .hasil{background:#fff;border:2px solid var(--garis);border-radius:14px;padding:16px}
#osis-app .baris{margin-bottom:16px}
#osis-app .baris:last-child{margin-bottom:0}
#osis-app .baris .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:5px;flex-wrap:wrap}
#osis-app .track{background:#e9eef8;border-radius:999px;height:26px;overflow:hidden}
#osis-app .isi{height:100%;background:linear-gradient(90deg,var(--biru2),#5b9bff);border-radius:999px;transition:width .6s;min-width:2px}
#osis-app .baris.unggul .isi{background:linear-gradient(90deg,var(--hijau),#52d38e)}
#osis-app .badge{background:var(--hijau);color:#fff;border-radius:6px;font-size:.72rem;padding:2px 8px;margin-left:6px;vertical-align:middle}
#osis-app .kecil-teks{color:var(--abu);font-size:.82rem;text-align:center;margin-top:10px}
#osis-app .aksi-admin{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#osis-app [hidden]{display:none!important}
@media(max-width:520px){#osis-app .foto{width:104px;height:104px}#osis-app .logo{width:48px;height:48px}#osis-app .hd{gap:8px;padding:12px}}
</style>

<div class="hd">
  <img id="o-logo1" class="logo" alt="Logo Sekolah" referrerpolicy="no-referrer" hidden>
  <div class="jdl"><h2 id="o-judul">Pemilihan Ketua OSIS</h2><p>SMAN 1 Seunuddon</p></div>
  <img id="o-logo2" class="logo" alt="Logo OSIS" referrerpolicy="no-referrer" hidden>
</div>

<div class="nav">
  <button id="o-tab-vote" class="on">Bilik Suara</button>
  <button id="o-tab-stat">Statistik</button>
</div>

<!-- BILIK SUARA -->
<div id="o-vote">
  <div id="o-pesan"></div>
  <div class="grid" id="o-grid"></div>
  <div class="bar-aksi" id="o-aksi" hidden>
    <div class="info" id="o-info">Belum memilih</div>
    <button class="btn" id="o-kirim" disabled>KIRIM SUARA</button>
  </div>
</div>

<!-- TERIMA KASIH -->
<div id="o-terima" hidden>
  <div class="tengah"><div class="terima">&#10004;</div>
  <div class="terima-j">Suara Anda sudah tersimpan</div>
  <div>Terima kasih. Kembali ke halaman calon...</div></div>
</div>

<!-- LOGIN STATISTIK -->
<div id="o-login" hidden>
  <div class="box">
    <b>Statistik hanya untuk panitia</b>
    <input type="password" id="o-pin" placeholder="PIN" inputmode="numeric" autocomplete="off">
    <div id="o-login-err" class="pesan err" hidden></div>
    <button class="btn kecil" id="o-masuk">Lihat Statistik</button>
  </div>
</div>

<!-- STATISTIK -->
<div id="o-stat" hidden>
  <div class="tiles" id="o-tiles"></div>
  <div class="hasil" id="o-hasil"></div>
  <div class="kecil-teks" id="o-update"></div>
  <div class="aksi-admin">
    <button class="btn kecil" id="o-segarkan">Segarkan</button>
    <button class="btn kecil merah" id="o-toggle">Tutup Pemilihan</button>
  </div>
</div>

<script>
(function(){
  /* >>> GANTI dengan URL Web App Apps Script (berakhiran /exec) <<< */
  var API_URL = "https://script.google.com/macros/s/AKfycbz_PPJqGJMD7Scw9lZyKQVlcSSjDaRWC0FjnTwqkbtZpLYKKkty82TFHh8y3OKADzCl/exec";

  var root = document.getElementById('osis-app');
  function $(id){ return root.querySelector('#'+id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

  var calon=[], pilihan=null, sibuk=false, pin='', timer=null, statusNow='BUKA';
  var views=['o-vote','o-terima','o-login','o-stat'];
  function tampil(id){
    views.forEach(function(v){ $(v).hidden = (v!==id); });
    $('o-tab-vote').className = (id==='o-vote'||id==='o-terima') ? 'on' : '';
    $('o-tab-stat').className = (id==='o-login'||id==='o-stat') ? 'on' : '';
    if(id!=='o-stat'){ clearInterval(timer); timer=null; }
  }

  /* Baca balasan server. Jika bukan JSON, tampilkan judul halaman yang dikirim agar penyebabnya jelas. */
  function baca(r){
    return r.text().then(function(t){
      try{ return JSON.parse(t); }
      catch(e){
        var m=t.match(/<title>([^<]*)<\/title>/i);
        throw new Error('Server mengirim halaman web, bukan data. Judul halaman: "'+(m?m[1].trim():'(tidak ada)')+
          '". Periksa deployment Apps Script: akses harus "Siapa saja" dan link berakhiran /exec.');
      }
    });
  }
  function post(body){
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
      .then(baca);
  }
  function get(q){ return fetch(API_URL+'?'+q).then(baca); }

  /* ---------- BILIK SUARA ---------- */
  function muatCalon(){
    pilihan=null; sibuk=false;
    $('o-pesan').innerHTML='<div class="tengah">Memuat daftar calon...</div>';
    $('o-grid').innerHTML=''; $('o-aksi').hidden=true;
    return get('action=calon').then(function(d){
      if(!d.ok) throw new Error(d.error||'Gagal memuat data');
      calon=d.calon; statusNow=d.config.status;
      $('o-judul').textContent=d.config.judul;
      pasangLogo('o-logo1', d.config.logoSekolah);
      pasangLogo('o-logo2', d.config.logoOsis);
      if(d.config.status!=='BUKA'){
        $('o-pesan').innerHTML='<div class="pesan tutup">Pemilihan belum dibuka atau sudah ditutup.</div>';
        return;
      }
      $('o-pesan').innerHTML='';
      renderCalon();
    }).catch(function(e){
      $('o-pesan').innerHTML='<div class="pesan err">'+esc(e.message)+'<br><button class="btn kecil" id="o-ulang" style="margin-top:8px">Coba lagi</button></div>';
      var u=$('o-ulang'); if(u) u.onclick=muatCalon;
    });
  }

  /* Ubah link Google Drive apa pun (link bagikan biasa, link thumbnail) menjadi URL gambar langsung */
  function fotoSumber(u){
    u=(u||'').trim(); if(!u) return null;
    var m=u.match(/\/d\/([\w-]{15,})/)||u.match(/[?&]id=([\w-]{15,})/);
    if(m && /google\.com|googleusercontent\.com/.test(u)){
      return {a:'https://lh3.googleusercontent.com/d/'+m[1]+'=w600',
              b:'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w600'};
    }
    return {a:u,b:''};
  }

  /* Pasang logo di header; jika link kosong atau gagal dimuat, logo disembunyikan */
  function pasangLogo(id,u){
    var im=$(id), s=fotoSumber(u);
    if(!s){ im.hidden=true; return; }
    im.onerror=function(){
      var b=im.getAttribute('data-b');
      if(b){ im.removeAttribute('data-b'); im.src=b; } else { im.hidden=true; }
    };
    im.setAttribute('data-b',s.b);
    im.src=s.a; im.hidden=false;
  }

  function renderCalon(){
    var g=$('o-grid'); g.innerHTML='';
    calon.forEach(function(c){
      var el=document.createElement('div'); el.className='card'; el.setAttribute('data-no',c.no);
      function orang(peran,nama,kelas,foto){
        var s=fotoSumber(foto);
        var f = s ? '<img src="'+esc(s.a)+'" data-b="'+esc(s.b)+'" referrerpolicy="no-referrer" alt="'+esc(nama)+'">' : esc((nama||peran).charAt(0).toUpperCase());
        return '<div class="org"><div class="foto">'+f+'</div><span class="peran">'+peran+'</span>'+
          '<h4>'+esc(nama)+'</h4><div class="kls">'+esc(kelas)+'</div></div>';
      }
      el.innerHTML='<span class="cek">&#10004;</span><span class="no">No. '+esc(c.no)+'</span>'+
        '<div class="duo">'+orang('Calon Ketua',c.ketua,c.kelasKetua,c.fotoKetua)+
        orang('Calon Wakil Ketua',c.wakil,c.kelasWakil,c.fotoWakil)+'</div>'+
        (c.visi?'<div class="visi">'+esc(c.visi)+'</div>':'');
      [].forEach.call(el.querySelectorAll('img'),function(im){
        im.onerror=function(){
          var b=im.getAttribute('data-b');
          if(b){ im.removeAttribute('data-b'); im.src=b; }
          else { im.parentNode.textContent=(im.alt||'?').charAt(0).toUpperCase(); }
        };
      });
      el.onclick=function(){ if(sibuk) return; pilih(c.no); };
      g.appendChild(el);
    });
    $('o-aksi').hidden=false; perbaruiAksi();
  }

  function pilih(no){
    pilihan=no;
    [].forEach.call(root.querySelectorAll('.card'),function(el){
      el.classList.toggle('pilih', Number(el.getAttribute('data-no'))===no);
    });
    perbaruiAksi();
  }
  function perbaruiAksi(){
    var c=calon.filter(function(x){return x.no===pilihan;})[0];
    $('o-info').textContent = c ? 'Pilihan Anda: No. '+c.no+' - '+c.ketua+(c.wakil?' & '+c.wakil:'') :'Klik salah satu calon';
    $('o-kirim').disabled = !c || sibuk;
  }

  $('o-kirim').onclick=function(){
    if(pilihan==null||sibuk) return;
    sibuk=true; $('o-kirim').disabled=true; $('o-kirim').textContent='Mengirim...';
    post({action:'vote',pilihan:pilihan}).then(function(d){
      $('o-kirim').textContent='KIRIM SUARA';
      if(!d.ok){
        sibuk=false; perbaruiAksi();
        $('o-pesan').innerHTML='<div class="pesan err">'+esc(d.error||'Gagal mengirim suara')+'</div>';
        return;
      }
      tampil('o-terima');
      setTimeout(function(){ if(!$('o-terima').hidden){ tampil('o-vote'); muatCalon(); } }, 2500);
    }).catch(function(){
      $('o-kirim').textContent='KIRIM SUARA'; sibuk=false; perbaruiAksi();
      $('o-pesan').innerHTML='<div class="pesan err">Koneksi bermasalah. Suara belum terkirim, silakan coba lagi.</div>';
    });
  };

  /* ---------- STATISTIK ---------- */
  function renderStat(d){
    $('o-judul').textContent=d.judul; statusNow=d.status;
    $('o-tiles').innerHTML=
      '<div class="tile"><b>'+d.total+'</b><span>Suara masuk</span></div>'+
      '<div class="tile"><b>'+d.batas+'</b><span>Jumlah pemilih</span></div>'+
      '<div class="tile"><b>'+d.sisa+'</b><span>Belum memilih</span></div>'+
      '<div class="tile"><b>'+d.partisipasi+'%</b><span>Partisipasi</span></div>'+
      '<div class="tile"><b>'+(d.status==='BUKA'?'BUKA':'TUTUP')+'</b><span>Status</span></div>';
    var max=Math.max.apply(null,d.hasil.map(function(h){return h.suara;}).concat([0]));
    var urut=d.hasil.slice().sort(function(a,b){return b.suara-a.suara;});
    $('o-hasil').innerHTML=urut.map(function(h){
      var unggul = max>0 && h.suara===max;
      return '<div class="baris'+(unggul?' unggul':'')+'"><div class="t"><span>No. '+esc(h.no)+' - '+esc(h.ketua)+(h.wakil?' &amp; '+esc(h.wakil):'')+
        (unggul?'<span class="badge">UNGGUL</span>':'')+'</span><span>'+h.suara+' suara ('+h.persen+'%)</span></div>'+
        '<div class="track"><div class="isi" style="width:'+h.persen+'%"></div></div></div>';
    }).join('') || 'Belum ada data calon.';
    $('o-update').textContent='Diperbarui: '+d.diperbarui+' (otomatis tiap 10 detik)';
    $('o-toggle').textContent = d.status==='BUKA' ? 'Tutup Pemilihan' : 'Buka Pemilihan';
  }
  function muatStat(){
    return post({action:'statistik',pin:pin}).then(function(d){
      if(!d.ok){ pin=''; tampil('o-login'); $('o-login-err').hidden=false; $('o-login-err').textContent=d.error; return; }
      tampil('o-stat'); renderStat(d);
      if(!timer) timer=setInterval(muatStat,10000);
    }).catch(function(){ $('o-update').textContent='Koneksi bermasalah, mencoba lagi...'; });
  }

  $('o-tab-vote').onclick=function(){ pin=''; tampil('o-vote'); muatCalon(); };
  $('o-tab-stat').onclick=function(){ $('o-pin').value=''; $('o-login-err').hidden=true; tampil('o-login'); $('o-pin').focus(); };
  $('o-masuk').onclick=function(){ pin=$('o-pin').value.trim(); if(pin) muatStat(); };
  $('o-pin').onkeydown=function(e){ if(e.key==='Enter') $('o-masuk').click(); };
  $('o-segarkan').onclick=muatStat;
  $('o-toggle').onclick=function(){
    var baru = statusNow==='BUKA' ? 'TUTUP' : 'BUKA';
    if(!confirm((baru==='TUTUP'?'Tutup':'Buka')+' pemilihan sekarang?')) return;
    post({action:'status',pin:pin,status:baru}).then(function(d){
      if(!d.ok){ alert(d.error); return; } muatStat();
    });
  };

  muatCalon();
})();
</script>
</div>
<!-- ===== AKHIR ===== -->
</body>
</html>
